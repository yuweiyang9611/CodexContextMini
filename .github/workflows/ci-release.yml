name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Windows / PowerShell 5.1 / Node 24
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          check-latest: false

      - name: Enforce email privacy policy
        shell: powershell
        run: node .\.githubhooks\check-email-policy.mjs --mode repository

      - name: Test email privacy hooks
        shell: powershell
        run: node --test .\tests\email-policy.tests.mjs

      - name: Validate plugin package
        shell: powershell
        run: .\tests\validate-package.ps1

      - name: Test PowerShell manager
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\tests\context-window.tests.ps1

      - name: Test MCP server and widget contract
        shell: powershell
        run: node --test .\tests\context-window-mcp.tests.mjs

      - name: Test release version gate
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\tests\release-automation.tests.ps1

      - name: Smoke-test release archives
        shell: powershell
        run: >-
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass
          -File .\scripts\build-release.ps1
          -Commitish $env:GITHUB_SHA
          -OutputDirectory (Join-Path $env:RUNNER_TEMP 'release-smoke')
          -Json

  release:
    name: Release a new manifest version
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve version gate
        id: version
        shell: pwsh
        env:
          BEFORE_SHA: ${{ github.event.before }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path variable:PSNativeCommandUseErrorActionPreference) {
            $PSNativeCommandUseErrorActionPreference = $false
          }

          $actualSha = (& git rev-parse HEAD).Trim()
          if ($actualSha -cne $env:SOURCE_SHA) {
            throw "Checked out $actualSha instead of tested commit $env:SOURCE_SHA."
          }

          $planJson = & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass `
            -File .\scripts\resolve-version-change.ps1 `
            -BeforeCommit $env:BEFORE_SHA `
            -CurrentCommit $env:SOURCE_SHA `
            -Json
          if ($LASTEXITCODE -ne 0) { throw "Version comparison failed with exit code $LASTEXITCODE." }
          $plan = (($planJson -join [Environment]::NewLine) | ConvertFrom-Json)
          $releaseVersion = [string]$plan.currentReleaseVersion
          $tag = [string]$plan.tag
          & git check-ref-format "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw "Invalid release tag: $tag" }

          "release_version=$releaseVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "changed=$(([bool]$plan.changed).ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          Write-Host ([string]$plan.reason)
          if (-not [bool]$plan.changed) {
            Write-Host 'The release version did not change; CI succeeds without publishing.'
          }

      - name: Check tag and Release state
        id: release_state
        if: steps.version.outputs.changed == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path variable:PSNativeCommandUseErrorActionPreference) {
            $PSNativeCommandUseErrorActionPreference = $false
          }

          $tag = $env:RELEASE_TAG
          $releaseVersion = $env:RELEASE_VERSION
          $tagRef = "refs/tags/$tag"
          $tagRows = @(& git ls-remote --tags origin $tagRef ($tagRef + '^{}'))
          if ($LASTEXITCODE -ne 0) { throw "Unable to inspect remote tag $tag." }
          $tagCommit = $null
          foreach ($row in $tagRows) {
            if ([string]::IsNullOrWhiteSpace([string]$row)) { continue }
            $parts = ([string]$row) -split '\s+', 2
            if ($parts.Count -ne 2) { throw "Unexpected ls-remote output for ${tag}: $row" }
            if ($parts[1] -ceq ($tagRef + '^{}')) { $tagCommit = $parts[0] }
            elseif ($null -eq $tagCommit -and $parts[1] -ceq $tagRef) { $tagCommit = $parts[0] }
          }

          $releaseJson = & gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft,assets,url 2>$null
          if ($LASTEXITCODE -eq 0) {
            $release = $releaseJson | ConvertFrom-Json
            if ($null -eq $tagCommit) {
              throw "Release $tag exists without a corresponding Git tag."
            }
            if ($tagCommit -cne $env:SOURCE_SHA) {
              throw "Release $tag belongs to commit $tagCommit, not this version-change commit $env:SOURCE_SHA."
            }
            if ([bool]$release.isDraft) {
              throw "A draft release already exists for $tag; inspect it before retrying automation."
            }
            $expectedAssets = @(
              "context-window-manager-v$releaseVersion.zip",
              "CodexContextPlugin-v$releaseVersion.zip",
              'SHA256SUMS.txt'
            )
            $actualAssets = @($release.assets | ForEach-Object { [string]$_.name })
            $missingAssets = @($expectedAssets | Where-Object { $actualAssets -cnotcontains $_ })
            if ($missingAssets.Count -gt 0) {
              throw "Published release $tag is missing assets: $($missingAssets -join ', ')"
            }
            Write-Host "Release $tag already exists with all expected assets; no release is needed."
            "publish=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 0
          }

          if ($null -ne $tagCommit -and $tagCommit -cne $env:SOURCE_SHA) {
            throw "Tag $tag already points to $tagCommit, not this version-change commit $env:SOURCE_SHA."
          }

          Write-Host "No published release exists for $tag; this version will be released."
          "publish=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build release archives from the tested commit
        if: steps.release_state.outputs.publish == 'true'
        shell: powershell
        run: >-
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass
          -File .\scripts\build-release.ps1
          -Commitish $env:GITHUB_SHA
          -OutputDirectory (Join-Path $env:RUNNER_TEMP 'release')
          -Json

      - name: Publish GitHub Release
        if: steps.release_state.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $env:RUNNER_TEMP 'release'
          $assets = @(Get-ChildItem -LiteralPath $dist -File | Sort-Object Name | ForEach-Object { $_.FullName })
          if ($assets.Count -ne 3) { throw "Expected exactly three release assets, found $($assets.Count)." }

          $arguments = @(
            'release', 'create', $env:RELEASE_TAG
          ) + $assets + @(
            '--repo', $env:GITHUB_REPOSITORY,
            '--target', $env:SOURCE_SHA,
            '--title', "Context Window Manager $env:RELEASE_VERSION",
            '--generate-notes'
          )
          if ($env:RELEASE_VERSION.Contains('-')) {
            $arguments += '--prerelease'
          }

          & gh @arguments
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE." }
