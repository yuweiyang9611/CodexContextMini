name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Windows / WPF / .NET 10 / Node 24
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          check-latest: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Enforce email privacy policy
        shell: powershell
        run: node .\.githubhooks\check-email-policy.mjs --mode repository

      - name: Test email privacy hooks
        shell: powershell
        run: node --test .\tests\email-policy.tests.mjs

      - name: Build Context Mini
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\scripts\build.ps1 -Configuration Release

      - name: Test Context Mini Core
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\scripts\test.ps1 -Configuration Release -NoBuild

      - name: Test release version gate
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\tests\release-automation.tests.ps1

      - name: Smoke-test WPF release archive
        shell: powershell
        run: >-
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass
          -File .\scripts\build-release.ps1
          -Commitish $env:GITHUB_SHA
          -OutputDirectory (Join-Path $env:RUNNER_TEMP 'release-smoke')
          -Json

  release:
    name: Release a new Context Mini version
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Resolve version gate
        id: version
        shell: pwsh
        env:
          BEFORE_SHA: ${{ github.event.before }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path variable:PSNativeCommandUseErrorActionPreference) {
            $PSNativeCommandUseErrorActionPreference = $false
          }
          $actualSha = (& git rev-parse HEAD).Trim()
          if ($actualSha -cne $env:SOURCE_SHA) { throw "Checked out $actualSha instead of $env:SOURCE_SHA." }
          $planJson = & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass `
            -File .\scripts\resolve-version-change.ps1 `
            -BeforeCommit $env:BEFORE_SHA `
            -CurrentCommit $env:SOURCE_SHA `
            -Json
          if ($LASTEXITCODE -ne 0) { throw "Version comparison failed with exit code $LASTEXITCODE." }
          $plan = (($planJson -join [Environment]::NewLine) | ConvertFrom-Json)
          $version = [string]$plan.currentReleaseVersion
          $tag = [string]$plan.tag
          & git check-ref-format "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw "Invalid release tag: $tag" }
          "release_version=$version" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=$tag" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "changed=$(([bool]$plan.changed).ToString().ToLowerInvariant())" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host ([string]$plan.reason)

      - name: Check tag and Release state
        id: release_state
        if: steps.version.outputs.changed == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path variable:PSNativeCommandUseErrorActionPreference) { $PSNativeCommandUseErrorActionPreference = $false }
          $tagRef = "refs/tags/$env:RELEASE_TAG"
          $tagRows = @(& git ls-remote --tags origin $tagRef ($tagRef + '^{}'))
          if ($LASTEXITCODE -ne 0) { throw "Unable to inspect $env:RELEASE_TAG." }
          $tagCommit = $null
          foreach ($row in $tagRows) {
            if ([string]::IsNullOrWhiteSpace([string]$row)) { continue }
            $parts = ([string]$row) -split '\s+', 2
            if ($parts.Count -ne 2) { throw 'Unexpected ls-remote output.' }
            if ($parts[1] -ceq ($tagRef + '^{}')) { $tagCommit = $parts[0] }
            elseif ($null -eq $tagCommit -and $parts[1] -ceq $tagRef) { $tagCommit = $parts[0] }
          }
          $releaseJson = & gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json isDraft,assets,url 2>$null
          if ($LASTEXITCODE -eq 0) {
            $release = $releaseJson | ConvertFrom-Json
            if ($null -eq $tagCommit) { throw 'Existing release has no matching tag.' }
            & git merge-base --is-ancestor $tagCommit $env:SOURCE_SHA
            if ($LASTEXITCODE -ne 0) { throw 'Existing release tag is not an ancestor of the tested commit.' }
            if ([bool]$release.isDraft) { throw 'A draft release already exists; inspect it before retrying.' }
            $expected = @("ContextMini-v$env:RELEASE_VERSION-win-x64.zip", 'SHA256SUMS.txt')
            $actual = @($release.assets | ForEach-Object { [string]$_.name })
            $missing = @($expected | Where-Object { $actual -cnotcontains $_ })
            if ($missing.Count -gt 0) { throw "Published release is missing: $($missing -join ', ')" }
            "publish=false" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 0
          }
          if ($null -ne $tagCommit -and $tagCommit -cne $env:SOURCE_SHA) { throw 'The release tag already points to another commit.' }
          "publish=true" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build WPF release archive
        if: steps.release_state.outputs.publish == 'true'
        shell: powershell
        run: >-
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass
          -File .\scripts\build-release.ps1
          -Commitish $env:GITHUB_SHA
          -OutputDirectory (Join-Path $env:RUNNER_TEMP 'release')
          -Json

      - name: Publish GitHub Release
        if: steps.release_state.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $assets = @(Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'release') -File | Sort-Object Name | ForEach-Object FullName)
          if ($assets.Count -ne 2) { throw "Expected two release assets, found $($assets.Count)." }
          $arguments = @('release','create',$env:RELEASE_TAG) + $assets + @(
            '--repo',$env:GITHUB_REPOSITORY,
            '--target',$env:SOURCE_SHA,
            '--title',"Context Mini $env:RELEASE_VERSION",
            '--generate-notes'
          )
          if ($env:RELEASE_VERSION.Contains('-')) { $arguments += '--prerelease' }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE." }