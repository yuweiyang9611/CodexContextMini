name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Windows / WPF / .NET 10 / Node 24
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate GitHub Actions workflows
        shell: powershell
        run: .\scripts\validate-github-actions.ps1 -RepositoryRoot $env:GITHUB_WORKSPACE

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          check-latest: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Enforce email privacy policy
        shell: powershell
        run: node .\.githubhooks\check-email-policy.mjs --mode repository

      - name: Test email privacy hooks
        shell: powershell
        run: node --test .\tests\email-policy.tests.mjs

      - name: Build Context Mini
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\scripts\build.ps1 -Configuration Release

      - name: Test Context Mini
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\scripts\test.ps1 -Configuration Release -NoBuild

      - name: Test release automation
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\tests\release-automation.tests.ps1

      - name: Build and inspect tested release assets
        shell: powershell
        run: >-
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass
          -File .\scripts\build-release.ps1
          -Commitish $env:GITHUB_SHA
          -OutputDirectory (Join-Path $env:RUNNER_TEMP 'release-assets')
          -Json

      - name: Upload tested release assets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: context-mini-release-${{ github.sha }}
          path: |
            ${{ runner.temp }}/release-assets/ContextMini-*.zip
            ${{ runner.temp }}/release-assets/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: Release a new Context Mini version
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    concurrency:
      group: release-${{ github.repository }}-main
      queue: max
      cancel-in-progress: false
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve version gate
        id: version
        shell: powershell
        env:
          BEFORE_SHA: ${{ github.event.before }}
          SOURCE_SHA: ${{ github.sha }}
        run: >-
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass
          -File .\scripts\resolve-ci-release.ps1
          -BeforeCommit $env:BEFORE_SHA
          -SourceSha $env:SOURCE_SHA
          -GitHubOutput $env:GITHUB_OUTPUT

      - name: Check tag and Release state
        id: release_state
        if: steps.version.outputs.changed == 'true'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
          SOURCE_SHA: ${{ github.sha }}
        run: >-
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass
          -File .\scripts\get-release-state.ps1
          -Repository $env:GITHUB_REPOSITORY
          -Tag $env:RELEASE_TAG
          -Version $env:RELEASE_VERSION
          -SourceSha $env:SOURCE_SHA
          -GitHubOutput $env:GITHUB_OUTPUT

      - name: Download tested release assets
        if: steps.version.outputs.changed == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: context-mini-release-${{ github.sha }}
          path: ${{ runner.temp }}/release

      - name: Verify tested release assets
        if: steps.version.outputs.changed == 'true'
        shell: powershell
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
        run: >-
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass
          -File .\scripts\verify-release-assets.ps1
          -AssetDirectory (Join-Path $env:RUNNER_TEMP 'release')
          -Version $env:RELEASE_VERSION

      - name: Publish GitHub Release
        if: steps.release_state.outputs.publish == 'true'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
          SOURCE_SHA: ${{ github.sha }}
        run: >-
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass
          -File .\scripts\publish-github-release.ps1
          -Mode Create
          -Repository $env:GITHUB_REPOSITORY
          -Tag $env:RELEASE_TAG
          -Version $env:RELEASE_VERSION
          -SourceSha $env:SOURCE_SHA
          -AssetDirectory (Join-Path $env:RUNNER_TEMP 'release')

      - name: Recover matching draft Release
        if: steps.release_state.outputs.recover == 'true'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
          SOURCE_SHA: ${{ github.sha }}
        run: >-
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass
          -File .\scripts\publish-github-release.ps1
          -Mode Recover
          -Repository $env:GITHUB_REPOSITORY
          -Tag $env:RELEASE_TAG
          -Version $env:RELEASE_VERSION
          -SourceSha $env:SOURCE_SHA
          -AssetDirectory (Join-Path $env:RUNNER_TEMP 'release')

      - name: Verify published GitHub Release assets
        if: steps.version.outputs.changed == 'true'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
          COMPARE_TESTED: ${{ steps.release_state.outputs.compare_tested }}
        run: >-
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass
          -File .\scripts\verify-github-release.ps1
          -Repository $env:GITHUB_REPOSITORY
          -Tag $env:RELEASE_TAG
          -Version $env:RELEASE_VERSION
          -DownloadDirectory (Join-Path $env:RUNNER_TEMP ("verify-" + $env:RELEASE_TAG))
          -TrustedDirectory (Join-Path $env:RUNNER_TEMP 'release')
          -CompareTested $env:COMPARE_TESTED

      - name: Ensure the highest stable version is Latest
        if: steps.version.outputs.changed == 'true'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass
          -File .\scripts\set-latest-github-release.ps1
          -Repository $env:GITHUB_REPOSITORY
